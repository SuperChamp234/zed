name: Build Windows (dev)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build_windows:
    runs-on: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Enable long paths
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set release channel to dev
        run: echo "dev" | Out-File -FilePath crates/zed/RELEASE_CHANNEL -Encoding ascii -NoNewline
        shell: pwsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-arm64-cargo-

      - name: Build zed.exe
        run: cargo build --release --package zed --target aarch64-pc-windows-msvc
        shell: pwsh

      - name: Upload zed.exe
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/zed.exe
          if-no-files-found: error
